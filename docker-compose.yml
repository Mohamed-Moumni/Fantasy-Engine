version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fantasy_user
      POSTGRES_PASSWORD: fantasy_password
      POSTGRES_DB: fantasy_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_user"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  engine:
    build: ./services/engine
    ports:
      - "8081:8080"
    env_file:
      - ./service/engine/.backend.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
