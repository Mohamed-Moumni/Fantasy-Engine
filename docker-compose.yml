version: "3.8"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .backend.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: go run ./cmd/server

volumes:
  postgres_data:
