name: Engine CI

on:
  push:
    branches: ["**"]
    paths:
      - 'services/engine/**'
      - 'pkg/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/engine/**'
      - 'pkg/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - run: go build -o bin/server ./cmd/server
      - run: go test -v ./...